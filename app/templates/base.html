<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{{ title }} · Duoweilai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="site-header">
  <a href="/" class="logo">Duoweilai</a>
  <div class="header-right">
    <a href="/explore">Explore</a>
    {% if user %}
    <a href="/notifications">Notifications{% if unread %}<span style="background:#ff7d7d;color:#0a0a0b;font-size:10px;border-radius:999px;padding:1px 5px;margin-left:4px">{{ unread }}</span>{% endif %}</a>
    <a href="/person/{{ user.username|urlencode }}">{{ user.username }}</a>
    <a href="/logout">Sign out</a>
    {% else %}
    <a href="/login">Sign in</a>
    <a href="/register" style="color:var(--fg)">Sign up</a>
    {% endif %}
  </div>
</header>
{% block content %}{% endblock %}
<div id="toast-root"></div>
<div id="confirm-root" class="confirm-overlay"><div class="confirm-box" id="confirm-box"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
