{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:480px;text-align:center">
  <div class="hero fade-in">
    <h1 style="font-size:26px">Welcome to Duoweilai</h1>
    <p>Your account is ready. This is your Duoweilai ID — like a QQ number.</p>
  </div>
  <div style="border:1px solid var(--border);border-radius:14px;padding:26px 20px;background:var(--input-bg)">
    <div style="font-size:11px;color:var(--subtle);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px">Your Duoweilai ID</div>
    <div style="font-size:38px;font-weight:600;letter-spacing:0.06em;font-variant-numeric:tabular-nums">{{ sys_id }}</div>
  </div>
  <p style="color:var(--muted);font-size:13.5px;line-height:1.6;margin-top:18px">
    Save this number — you'll use it, or your email, to sign in.<br>
    It shows on everything you plant.
  </p>
  <a href="/" class="btn-primary" style="display:inline-block;text-decoration:none;padding:12px 28px;margin-top:8px">Enter the world</a>
</div>
{% endblock %}
