[project]
name = "duoweilai-web"
version = "0.6"
description = "Duoweilai — multiple futures, collaborative imagination platform."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Duoweilai team" }]
keywords = ["flask", "sqlite", "collaboration", "future-seeds", "imagination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Framework :: Flask :: 3.0",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Sociology :: History",
]

dependencies = [
    "flask>=3.0",
    "gunicorn>=21.2 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "coverage>=7.5"]

[project.urls]
Homepage = "https://github.com/huliye24/duoweilai-web"
Issues = "https://github.com/huliye24/duoweilai-web/issues"

# ============================================================
# Ruff (linter + formatter)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive", "venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (covered by formatter)
    "B008",   # function call in default argument (Flask routes use this)
    "N818",   # error class name should end with Error (avoid churn)
    # --- 中英混合项目友好规则 ---
    "RUF002", # docstring 里的全角字符：同上
    "RUF003", # 注释里的全角字符（中文括号/标点）：项目大量使用中文注释，关掉
    "RUF012", # 可变默认参数：与 B008 不同场景，避免和 Flask 模式混淆
    "N806",   # 变量大小写：模块级 logger 常量大写会被误报
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N802"]  # tests can have asserts and lowercase method names

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================
# Mypy
# ============================================================
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["app"]
omit = ["app/static/*", "app/templates/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_empty = true

# ============================================================
# Build system
# ============================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]
